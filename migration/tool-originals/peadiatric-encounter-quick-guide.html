function findClosestVSByMonths(years, months) {
  const totalMonths = years * 12 + months;
  let closest = vsTable[0];
  for (let i = 1; i < vsTable.length; i++) {
    const refMonths = vsTable[i].age * 12;
    if (totalMonths >= refMonths) closest = vsTable[i];
    else break;
  }
  return closest;
}

   function getBP5thCentile(ageY) {
      if (ageY < 1) return "65–75";
      if (ageY < 2) return "70–75";
      if (ageY < 5) return "70–80";
      if (ageY < 12) return "80–90";
      return "90–105";
    }
    function calcBP5th(ageY) {
      return Math.round(65 + 2 * ageY);
    }

    // Set max date for DOB to today
    document.getElementById('dob').max = new Date().toISOString().split('T')[0];

    function calculateAgeObject(dobStr) {
      if (!dobStr) return null;
      const dob = new Date(dobStr);
      const now = new Date();
      let years = now.getFullYear() - dob.getFullYear();
      let months = now.getMonth() - dob.getMonth();
      let days = now.getDate() - dob.getDate();
      if (days < 0) {
        months -= 1;
        days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
      }
      if (months < 0) {
        years -= 1;
        months += 12;
      }
      // For precise age in years (decimal)
      const ageInYears = ((now - dob) / (365.25 * 24 * 60 * 60 * 1000));
      return { years, months, days, ageInYears: Math.max(0, ageInYears) };
    }

    function renderBPTable(bpData, age, selectedHeightPct = null) {
  const heightLabels = ['50%', '90%', '95%'];
  const bpLabels = ['5th', '50th', '95th'];
  if (!bpData[age]) return '<div style="color:#b71c1c;">BP data not available for this age.</div>';
  const sbp = bpData[age].sbp;
  const dbp = bpData[age].dbp;

  let html = `<table style="width:100%;text-align:center;margin-bottom:10px;">
    <tr>
      <th>Height centile</th>
      <th colspan="3">Systolic BP (mmHg)</th>
      <th colspan="3">Diastolic BP (mmHg)</th>
    </tr>
    <tr>
      <th></th>
      <th>5th</th><th>50th</th><th>95th</th>
      <th>5th</th><th>50th</th><th>95th</th>
    </tr>`;

  let rowsToShow = [0, 1, 2];
  if (selectedHeightPct !== null) {
    let pctIdx = {50:0, 90:1, 95:2}[selectedHeightPct];
    rowsToShow = [pctIdx];
  }

  for (let r of rowsToShow) {
    html += `<tr>
      <td>${heightLabels[r]}</td>
      ${sbp[r].map((v, c) =>
        `<td style="background:${c === 0 ? '#CFFAD0' : ''};font-weight:${c === 0 ? 'bold' : 'normal'}">${v}</td>`
      ).join('')}
      ${dbp[r].map((v, c) =>
        `<td style="background:${c === 0 ? '#CFFAD0' : ''};font-weight:${c === 0 ? 'bold' : 'normal'}">${v}</td>`
      ).join('')}
    </tr>`;
  }
  html += `</table>`;
  return html;

  { years: 5, months: null, label: "5–12 years", w: "",       h: "5 cm/year", hc: "0.33 cm/year" }
];

function getAnthropometric(years, months) {
  // Find if age matches any row (first 6)
  let found = anthropometricRef.find(row =>
    row.months !== null && row.years === years && row.months === months
  );
  // If not found, check for 5–12 years (any months)
  if (!found && years >= 5 && years <= 12) {
    found = anthropometricRef.find(row => row.label === "5–12 years");
  }

  let tableHTML = "";
  if (found) {
    tableHTML = `
      <table style="width:100%;background:#fff;border-radius:6px;font-size:0.97em;margin-bottom:8px;table-layout:fixed;">
        <tr>
          <th style="width:26%;">Age</th>
          <th style="width:21%;">Weight</th>
          <th style="width:28%;">Height</th>
          <th style="width:25%;">Head size</th>
        </tr>
        <tr>
          <td>${found.label}</td>
          <td>${found.w || ""}</td>
          <td>${found.h || ""}</td>
          <td>${found.hc || ""}</td>
        </tr>
      </table>
    `;
  }

  // ---- Weight estimation block (reuse your own, or copy this) ----
  let wtFormula = "", wtVal = "";
  if (years < 1) {
    wtFormula = "months × 0.5 + 4";
    wtVal = Math.round(months * 0.5 + 4) + " kg";
  } else if (years < 10.1) {
    wtFormula = "(years + 4) × 2";
    wtVal = Math.round((years + 4) * 2) + " kg";
  }

  let wtEstBlock = "";
  if (wtFormula && wtVal) {
    wtEstBlock = `
      <div style="margin:12px 0 8px 0;padding:10px 15px;background:#ede7f6;border-radius:8px;">
        <div style="font-weight:normal;font-size:1.07em;">
          Weight estimation: <span style="color:#2e7d32;font-size:1.08em;">${wtVal}</span>
        </div>
        <div style="font-size:97%;margin-top:4px;color:#1976d2;">
          Formula: <span style="font-family:monospace;color:#222;">${wtFormula} kg</span>
        </div>
      </div>
    `;
  }

  // ---- Points to note block (unchanged) ----
  const notesBlock = `
    <div style="font-size:93%">
      <b>Points to Note</b><br>
      <u>Weight</u>:<br>
      • 1st 7–10 days: babies lose 10–15% birth weight.<br>
      • 1st 3 months: gain ≈25g/day.<br>
      • Babies regain birth weight by week 2, double by 5 months, triple by 1 year.<br>
      <u>Head circumference</u>:<br>
      • Preterm: ≈1 cm/week growth but reduces with age.<br>
      • HC +12 cm in 1st year (6 cm in first 3 months, then 3 cm in second 3 months, and 3 cm in last 6 months).<br>
    </div>
  `;

  return tableHTML + wtEstBlock + notesBlock;
}

function getImmunizationSection(years, months) {
  const totalMonths = years * 12 + months;
  let html = `<table style="width:100%;background:#fff;border-radius:6px;font-size:0.97em;margin-bottom:8px;">
    <tr><th align="left">Vaccine</th><th>Dos</th><th>Age</th><th>Status</th></tr>`;
  imunisasiSchedule.forEach(vac => {
    vac.doses.forEach(dose => {
      let yearsDue = Math.floor(dose.when / 12);
      let monthsDue = dose.when % 12;
      let dueStr = '';
      if (yearsDue > 0 && monthsDue > 0) {
        dueStr = yearsDue + " tahun " + monthsDue + " bulan";
      } else if (yearsDue > 0) {
        dueStr = yearsDue + " tahun";
      } else {
        dueStr = monthsDue + " bulan";
      }
      let status = totalMonths >= dose.when ? "✅" : "❌";
      html += `<tr>
        <td>${vac.label}</td>
        <td>${dose.label}</td>
        <td>${dueStr}</td>
        <td style="text-align:center;">${status}</td>
      </tr>`;
    });
  });
  html += `</table>
    <div style="font-size:92%;color:#1976d2;"><b>✅</b> Should have been completed by this age.<br>
    <b>❌</b> Not yet due / wait for the appropriate age.</div>

  return html;
}

function getIVFluidMaintenance(weight) {
  if (!weight || isNaN(weight) || weight <= 0) {
    return `<div style="color:#b71c1c;">Please enter weight to calculate maintenance fluids.</div>`;
  }
  weight = parseFloat(weight);
  let total = 0;
  let step = "";

  if (weight <= 10) {
    total = weight * 100;
    step = `${weight} kg × 100 ml = <b>${total} ml/day</b>`;
  } else if (weight <= 20) {
    total = 1000 + (weight - 10) * 50;
    step = `10 kg × 100 ml = 1000 ml + (${weight - 10} kg × 50 ml = ${(weight - 10) * 50} ml) = <b>${total} ml/day</b>`;
  } else {
    total = 1500 + (weight - 20) * 20;
    step = `10 kg × 100 ml = 1000 ml + 10 kg × 50 ml = 500 ml + (${weight - 20} kg × 20 ml = ${(weight - 20) * 20} ml) = <b>${total} ml/day</b>`;
  }
  // Infusion rate (per hour)
  let rate = Math.round(total / 24);

  // Stepwise rates
  let hourlyStep = "";
  if (weight <= 10) {
    hourlyStep = `${weight} kg × 4 ml = <b>${(weight * 4).toFixed(1)} ml/hr</b>`;
  } else if (weight <= 20) {
    hourlyStep = `10 kg × 4 ml = 40 ml/hr + (${weight - 10} kg × 2 ml = ${((weight - 10) * 2).toFixed(1)} ml/hr) = <b>${(40 + (weight - 10) * 2).toFixed(1)} ml/hr</b>`;
  } else {
    hourlyStep = `10 kg × 4 ml = 40 ml/hr + 10 kg × 2 ml = 20 ml/hr + (${weight - 20} kg × 1 ml = ${(weight - 20).toFixed(1)} ml/hr) = <b>${(60 + (weight - 20) * 1).toFixed(1)} ml/hr</b>`;
  }

  return `
    <table style="width:100%;background:#fff;border-radius:6px;font-size:0.97em;margin-bottom:8px;">
      <tr><th>Total Fluids (per day)</th><th>Infusion Rate (per hour)</th></tr>
      <tr>
        <td>${total} ml/day<br><span style="font-size:90%">${step}</span></td>
        <td>${rate} ml/hr<br><span style="font-size:90%">${hourlyStep}</span></td>
      </tr>
    </table>
    <div style="font-size:92%">
      <b>Reference (Holliday-Segar method):</b><br>
      • First 10 kg: 100 ml/kg/day (4 ml/kg/hr)<br>
      • Next 10 kg: 50 ml/kg/day (2 ml/kg/hr)<br>
      • Each kg >20 kg: 20 ml/kg/day (1 ml/kg/hr)
    </div>
  `;
}

    function getBP5thCentileText(ageY) {
  // Returns text based on your table (from image)
  if (ageY < 1) return "65–75 mmHg";
  if (ageY < 2) return "70–75 mmHg";
  if (ageY < 5) return "70–80 mmHg";
  if (ageY < 12) return "80–90 mmHg";
  return "90–105 mmHg";
}

function calcBP5th(ageY) {
  // Returns integer, per formula
  return Math.round(65 + 2 * ageY);
}
function roundToNearestHalf(num) {
  return (Math.round(num * 2) / 2).toFixed(1);
}
function getETTSection(years, weight) {
  // Calculate suggested ETT size & length
  let ettSize = "-", ettLen = "-";
  if (years === 0 && weight && weight > 0) {
    if (weight < 1) ettSize = "2.5 mm";
    else if (weight < 2) ettSize = "3.0 mm";
    else if (weight < 3) ettSize = "3.5 mm";
    else ettSize = "3.5 – 4.0 mm";
    ettLen = (6 + Number(weight)).toFixed(1) + " cm";
  } else if (years >= 1) {
    ettSize = roundToNearestHalf(4 + (years / 4)) + " mm";
    ettLen = (12 + (years / 2)).toFixed(1) + " cm";
  }

  return `
    <div class="ett-section">
      <div class="section-title" style="margin-top:0;">Choosing ETT Size (mm)</div>
      <div class="ett-alert">
        <b>Calculated for your patient:</b>
        <ul>
          <li><b>Suggested ETT size:</b> <span class="ett-value-main">${ettSize}</span></li>
          <li><b>Suggested oral ETT length:</b> <span class="ett-value-sec">${ettLen}</span></li>
        </ul>
      </div>
      <div class="ett-formulas">
        <b>Formulas:</b>
        <ul>
          <li><b>For Children &gt; 1 year:</b>
            <ul>
              <li><b>ETT size (mm)</b> = <span class="ett-formula">4 + (age in years / 4)</span></li>
              <li><b>Oral ETT length (cm)</b> = <span class="ett-formula">12 + (age in years / 2)</span></li>
            </ul>
          </li>
        </ul>
      </div>
      <div class="ett-recommend">
        <b>Recommended Size of ETT (mm) for Neonates:</b>
        <ul>
          <li><b>2.5 mm</b> for &lt;1 kg</li>
          <li><b>3.0 mm</b> for 1–2 kg</li>
          <li><b>3.5 mm</b> for 2–3 kg</li>
          <li><b>3.5–4.0 mm</b> for &gt;3 kg</li>
        </ul>
        <div style="font-size:92%;color:#ff7043;margin-top:0.3em;"><b>Emergency use:</b> If in doubt, choose the smaller size!</div>
      </div>
    </div>
  `;
}
